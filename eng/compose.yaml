# Containers of eng/ (docs/design/eng-test.md). From the repository root:
#   docker compose -f eng/compose.yaml run --rm test
# From a linked git worktree add eng/compose.worktree.yaml (docs/design/eng-test.md, "Linked worktrees").
name: great-parts-cel-eng

services:
  # eng/test: build, tests and checks. Arguments after the service name go to the command of eng/run.
  test:
    build:
      context: docker
      target: sdk
    working_dir: /repo
    volumes:
      - ..:/repo
      - nuget:/root/.nuget/packages
    entrypoint: [dotnet, run, --project, eng/run, --, test]

  # eng/mutate: mutation testing of the changed code (docs/design/eng-mutate.md). The configuration file is the argument after the
  # service name; without one it is stryker-config.json. It has no second Compose file: in a linked worktree the command stops.
  mutate:
    build:
      context: docker
      target: sdk
    working_dir: /repo
    volumes:
      - ..:/repo
      - nuget:/root/.nuget/packages
    entrypoint: [dotnet, run, --project, eng/run, --, mutate]

  # eng/test for Native AOT: tests under JIT and Native AOT on linux-x64 for both targets, and the test count. It runs on the
  # image stage with the native toolchain and is not part of the service test; it takes minutes.
  test-aot:
    build:
      context: docker
      target: sdk-aot
    working_dir: /repo
    volumes:
      - ..:/repo
      - nuget:/root/.nuget/packages
    entrypoint: [dotnet, run, --project, eng/run, --, test-aot]

  # Builds a sample application on the .NET SDK 10.0.100 from the packed Great.Parts.Cel of artifacts/packages; run it
  # after the service test. It has its own packages folder under artifacts/min-sdk and does not use the volume nuget.
  # "$$" is a literal "$" for Compose.
  min-sdk:
    build:
      context: docker
      target: sdk-min
    working_dir: /repo/eng/min-sdk
    volumes:
      - ..:/repo
    entrypoint:
      - bash
      - -c
      - |
        set -u -o pipefail
        fail() { echo "min-sdk: failed: $$1"; exit 1; }
        out=../../artifacts/min-sdk
        packages=(../../artifacts/packages/Great.Parts.Cel.[0-9]*.nupkg)
        [ -e "$${packages[0]}" ] || fail "no package in artifacts/packages; run the service test first"
        rm -rf "$$out"
        mkdir -p "$$out"
        echo "== sdk version"
        version=$$(dotnet --version) || fail "dotnet --version"
        echo "$$version"
        [ "$$version" = "10.0.100" ] || fail "sdk version $$version, expected 10.0.100"
        echo "== build"
        dotnet build -c Release --artifacts-path "$$out/build" -p:ReportAnalyzer=true \
          "-flp:LogFile=$$out/build.log;Verbosity=diagnostic" 2>&1 | tee "$$out/console.log"
        [ "$${PIPESTATUS[0]}" = "0" ] || fail "build"
        grep -q "^ *0 Warning(s)" "$$out/console.log" || fail "build: warnings"
        grep -q "^ *0 Error(s)" "$$out/console.log" || fail "build: errors"
        echo "== evidence"
        assets=$$(find "$$out/build" -name project.assets.json | head -n 1)
        grep -n "analyzers/dotnet/cs/Great.Parts.Cel.Generator.dll" "$$assets" || fail "evidence: generator not in project.assets.json"
        grep -n "Great.Parts.Cel.Generator.CelTypeContextGenerator" "$$out/build.log" || fail "evidence: generator not in the analyzer report"
        echo "min-sdk: passed"

  # eng/difftest: the differential run against cel-go (docs/design/eng-difftest.md). Compose starts the service oracle first;
  # the options of the run follow the service name, for example --seed 20261104 --budget 2h. Exit code 0, 1 or 2.
  difftest:
    build:
      context: docker
      target: sdk
    working_dir: /repo
    volumes:
      - ..:/repo
      - nuget:/root/.nuget/packages
    depends_on:
      - oracle
    entrypoint: [dotnet, run, --project, eng/run, --, difftest]

  # The oracle of the differential run: cel-go in the official golang image, Go only here (docs/design/eng-oracle.md).
  # Without arguments the launcher serves one session of eng/difftest on port 7070 of the project network and ends
  # itself; with arguments it runs the oracle with them, for example:
  #   docker compose -f eng/compose.yaml run --rm -T oracle serve --env eng/difftest/Profile/environment.json
  # The image tag equals the go line of eng/oracle/go.mod. Time zones come only from zoneinfo.zip of that Go: the
  # system zone directory is hidden under an empty tmpfs. No version stamp, so the build does not read git.
  oracle:
    image: golang:1.27.3
    working_dir: /repo/eng/oracle
    volumes:
      - ..:/repo
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    tmpfs:
      - /usr/share/zoneinfo
    environment:
      GOTOOLCHAIN: local
      ZONEINFO: /usr/local/go/lib/time/zoneinfo.zip
      GOFLAGS: -mod=readonly -buildvcs=false
    entrypoint: [go, run, ./launch]

volumes:
  nuget:
  gomod:
  gobuild:
