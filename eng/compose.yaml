# Containers of eng/ (docs/design/eng-test.md). From the repository root:
#   docker compose -f eng/compose.yaml run --rm test
# From a linked git worktree add eng/compose.worktree.yaml (docs/design/eng-test.md, "Linked worktrees").
name: great-parts-cel-eng

services:
  # eng/test: the full check in one command: build, all tests under JIT, the checks, and the tests under Native AOT on linux-x64 with
  # the test count (docs/design/eng-test.md). It runs on the image stage with the native toolchain. Arguments after the service name
  # go to the command of eng/run.
  test:
    build:
      context: docker
      target: sdk-aot
    working_dir: /repo
    volumes:
      - ..:/repo
      - nuget:/root/.nuget/packages
    entrypoint: [dotnet, run, --project, eng/run, --, test]

  # eng/mutate: mutation testing of the changed code (docs/design/eng-mutate.md). The arguments after the service name are a
  # configuration file (without one: stryker-config.json) and --since <commit>, the commit from which the changes are counted
  # (without it: the target of the configuration, main). In a linked worktree, with the second Compose file, only a run without
  # since goes on, such as the control set: a run with since stops.
  mutate:
    build:
      context: docker
      target: sdk
    working_dir: /repo
    volumes:
      - ..:/repo
      - nuget:/root/.nuget/packages
    entrypoint: [dotnet, run, --project, eng/run, --, mutate]

  # Builds a sample application on the .NET SDK 10.0.100 from the packed Great.Parts.Cel of artifacts/packages; run it after the
  # service test. The image has no SDK 11, which building eng/run needs, so the service runs the eng/run that the service test
  # compiled. It has its own packages folder under artifacts/min-sdk and does not use the volume nuget
  # (docs/design/eng-test.md, "min-sdk").
  min-sdk:
    build:
      context: docker
      target: sdk-min
    working_dir: /repo
    volumes:
      - ..:/repo
    entrypoint: [dotnet, eng/run/bin/Release/net10.0/Great.Parts.Cel.Eng.Run.dll, min-sdk]

  # eng/difftest: the differential run against cel-go (docs/design/eng-difftest.md). Compose starts the service oracle first;
  # the options of the run follow the service name, for example --seed 20261104 --budget 2h. Exit code 0, 1 or 2.
  difftest:
    build:
      context: docker
      target: sdk
    working_dir: /repo
    volumes:
      - ..:/repo
      - nuget:/root/.nuget/packages
    depends_on:
      - oracle
    entrypoint: [dotnet, run, --project, eng/run, --, difftest]

  # The oracle of the differential run: cel-go in the official golang image, Go only here (docs/design/eng-oracle.md).
  # Without arguments the launcher serves one session of eng/difftest on port 7070 of the project network and ends
  # itself; with arguments it runs the oracle with them, for example:
  #   docker compose -f eng/compose.yaml run --rm -T oracle serve --env eng/difftest/Profile/environment.json
  # The image tag equals the go line of eng/oracle/go.mod. Time zones come only from zoneinfo.zip of that Go: the
  # system zone directory is hidden under an empty tmpfs. No version stamp, so the build does not read git.
  oracle:
    image: golang:1.27.3
    working_dir: /repo/eng/oracle
    volumes:
      - ..:/repo
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    tmpfs:
      - /usr/share/zoneinfo
    environment:
      GOTOOLCHAIN: local
      ZONEINFO: /usr/local/go/lib/time/zoneinfo.zip
      GOFLAGS: -mod=readonly -buildvcs=false
    entrypoint: [go, run, ./launch]

volumes:
  nuget:
  gomod:
  gobuild:
