<text x="159" y="138" font-family="'DejaVu Sans', sans-serif" font-size="16.984126984126984" font-weight="normal" fill="#c7c4e8" text-anchor="middle">HTTP, with the claims</text>
<text x="159" y="164" font-family="'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#c7c4e8" text-anchor="middle">of the user</text>
