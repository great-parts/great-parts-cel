<text x="453" y="138" font-family="'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#c7c4e8" text-anchor="middle">'admin' in user.role</text>
<text x="453" y="164" font-family="'DejaVu Sans', sans-serif" font-size="17" font-weight="normal" fill="#c7c4e8" text-anchor="middle">false: 403</text>
<line x1="580" y1="135" x2="610" y2="135" stroke="#f06449" stroke-width="4"/>
<polygon points="620,135 606,126 606,144" fill="#f06449"/>
