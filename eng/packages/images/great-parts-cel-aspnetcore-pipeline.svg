<title id="t">Great.Parts.Cel.AspNetCore: CEL in authorization and request validation</title>
<desc id="d">A request passes a CEL authorization policy, then a CEL validation of the request body, and then reaches the endpoint handler. A failed policy gives 403 and a failed validation gives 400.</desc>
<rect width="1200" height="300" rx="22" fill="#1e1b4b"/>
