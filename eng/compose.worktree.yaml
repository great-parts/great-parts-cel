# Second Compose file for a run from a linked git worktree (docs/design/eng-test.md, "Linked worktrees"):
#   ENG_GIT_COMMON_DIR="$(git rev-parse --path-format=absolute --git-common-dir)" \
#   ENG_WORKTREE_NAME="$(basename "$(git rev-parse --show-toplevel)")" \
#     docker compose -f eng/compose.yaml -f eng/compose.worktree.yaml run --rm test
# /repo/.git of a linked worktree is a file with a host path that the container cannot reach. The two read-only
# mounts give git the common git directory at /git and the file artifacts/worktree/gitdir in place of /repo/.git;
# the host file stays unchanged. A missing source stops the run instead of creating a host directory. Every service
# that runs eng/run gets them: test, mutate, docs, difftest and min-sdk.
# The project name carries the name of the working copy, so runs from different working copies never share containers, networks
# or the service oracle (docs/design/eng-test.md, "Linked worktrees"); the main working copy keeps the name of eng/compose.yaml.
# Compose lowercases the name. The named volumes keep their names in every project; the project of the main working copy
# creates them, so here they are external: Compose takes them as they are and does not warn that another project made them.
# A machine that has never run eng/compose.yaml from the main working copy creates them once: docker volume create <name>.
name: great-parts-cel-eng-${ENG_WORKTREE_NAME:?set ENG_WORKTREE_NAME to the name of the working copy directory}

x-git: &git
  - type: bind
    source: ${ENG_GIT_COMMON_DIR:?set ENG_GIT_COMMON_DIR to the common git directory of the repository}
    target: /git
    read_only: true
    bind:
      create_host_path: false
  - type: bind
    source: ../artifacts/worktree/gitdir
    target: /repo/.git
    read_only: true
    bind:
      create_host_path: false

services:
  test:
    volumes: *git
  # In a linked worktree mutate runs only without since, such as the control set (docs/design/eng-mutate.md, "Linked worktrees").
  mutate:
    volumes: *git
  docs:
    volumes: *git
  difftest:
    volumes: *git
  min-sdk:
    volumes: *git

volumes:
  nuget:
    name: great-parts-cel-eng_nuget
    external: true
  gomod:
    name: great-parts-cel-eng_gomod
    external: true
  gobuild:
    name: great-parts-cel-eng_gobuild
    external: true
