# The benchmark rig (docs/design/eng-bench.md): the speed comparison with other CEL libraries for .NET, on request. It runs on a
# GitHub-hosted runner only, by hand: no trigger but the manual one, and no measurement on a developer machine. The runs of one
# measurement go one after another in one job, so on one virtual machine. The rig measures Great.Parts.Cel built from the sources of
# the commit, on .NET 11 under JIT. After the runs, in the same job, the script measures the limits of the speed-ups of the library (the
# search of the literal prefix of matches around 64 code units, the build of the automaton of the pattern E5, the scan and the buckets
# of the index of distinct and sets) and the diagnostics without a verdict (the search of a substring, the simple entry, CelMap.Create)
# and writes them into the summary.
# The result is the artifact bench-results (the summary, the verification, the table and the BenchmarkDotNet reports of every run, the
# verdicts and the reports of the limits) and the step summary. The workflow has no secrets and reads the repository only. It sets no timeout-minutes: the protection
# against a hung job is the default limit of GitHub Actions, 6 hours.
# The publication of a result: the job `bench` makes the report (report.json, report.md, the verification and the table of each run:
# the date and the time in UTC, the commit of this repository, the run) and keeps it as the artifact bench-report; the job `publish`,
# the only one with `permissions: contents: write`, commits it to the branch `reports` (publish-report.yml, docs/design/eng-release.md,
# "Reports of the runs"). It runs for a measurement (job Default) of at least 3 runs on the main branch; a Dry run is a check of the
# rig, not a result.
name: bench

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "The number of measurement runs, one after another in this job (at least 3 for a result)."
        type: string
        default: "3"
      job:
        description: "Default: the measurement. Dry: one call per case, a check of the rig without a measurement."
        type: choice
        options:
          - Default
          - Dry
        default: Default
      cases:
        description: "The cases to run, ids separated by commas, for example E1,E5 or E2/10. Without it: every case."
        type: string
        required: false
      thresholds:
        description: "Measure the limits of the speed-ups of the library after the runs of the rig, in the same job (the job above applies to them too)."
        type: boolean
        default: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  bench:
    name: Benchmark rig
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The SDK 11 of global.json builds the rig and brings the runtime of net11.0, on which the rig runs under JIT.
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # The lock file of the rig is recreated when the locked restore refuses it (a changed version of a package): the new file is in the
      # artifact, and a commit takes it into the repository.
      - name: Restore (locked)
        run: |
          if ! dotnet restore bench/SpeedBench/SpeedBench.csproj --locked-mode; then
            echo "::warning::The lock file of the rig does not match the packages; it is recreated."
            dotnet restore bench/SpeedBench/SpeedBench.csproj --force-evaluate
          fi

      # run.mjs builds the rig, verifies every library on every case, then measures, then measures the limits of the speed-ups (it builds
      # bench/ThresholdBench, which restores its packages itself); the summary is written even after a failed run.
      - name: Measurement (bench/run.mjs)
        env:
          # The values reach the script only through the environment, never through the text of the script.
          RUNS: ${{ inputs.runs }}
          BENCH_JOB: ${{ inputs.job }}
          BENCH_CASES_INPUT: ${{ inputs.cases }}
          BENCH_THRESHOLDS: ${{ inputs.thresholds }}
        run: |
          set -u
          if ! [[ "$RUNS" =~ ^[1-9][0-9]?$ ]]; then
            echo "The runs are a number from 1 to 99."
            exit 2
          fi
          if ! [[ "$BENCH_JOB" =~ ^(Default|Dry)$ ]]; then
            echo "The job is Default or Dry."
            exit 2
          fi
          arguments=(--runs "$RUNS")
          if [ "$BENCH_JOB" != "Default" ]; then
            arguments+=(--job "$BENCH_JOB")
          fi
          if [ -n "$BENCH_CASES_INPUT" ]; then
            if ! [[ "$BENCH_CASES_INPUT" =~ ^E[1-9](/(10|100))?(,E[1-9](/(10|100))?)*$ ]]; then
              echo "The cases are ids such as E1 or E2/10, separated by commas."
              exit 2
            fi
            arguments+=(--cases "$BENCH_CASES_INPUT")
          fi
          if [ "$BENCH_THRESHOLDS" != "true" ]; then
            arguments+=(--no-thresholds)
          fi
          node bench/run.mjs "${arguments[@]}"

      # The report is made after a result only; the inputs reach the script through the environment.
      - name: Report
        env:
          RUNS: ${{ inputs.runs }}
          BENCH_JOB: ${{ inputs.job }}
          BENCH_CASES_INPUT: ${{ inputs.cases }}
        run: node .github/scripts/bench-report.mjs --results bench/results --output report --runs "$RUNS" --job "$BENCH_JOB" --cases "$BENCH_CASES_INPUT"

      - name: Summary
        if: ${{ always() }}
        run: |
          if [ -f bench/results/summary.md ]; then
            # The step summary of GitHub is limited to 1 MiB.
            head -c 900000 bench/results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # The artifact is uploaded even after a failed run. The directories of the projects that BenchmarkDotNet builds are left out:
      # the reports and the logs are the result.
      - name: Results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: |
            bench/results/summary.md
            bench/results/verify.json
            bench/results/runs/*/run.json
            bench/results/runs/*/summary.md
            bench/results/runs/*/bdn/results
            bench/results/runs/*/bdn/*.log
            bench/results/thresholds/meta.json
            bench/results/thresholds/thresholds.json
            bench/results/thresholds/bdn/results
            bench/results/thresholds/bdn/*.log
          if-no-files-found: warn

      - name: Lock file of the rig
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-lock
          path: bench/SpeedBench/packages.lock.json
          if-no-files-found: warn

      - name: Report (artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-report
          path: report
          if-no-files-found: error

  # The branch `reports` is written by this job only. A Dry run, a measurement of fewer than 3 runs and a run from another branch
  # are not published. `runs` is checked by the job above, so fromJSON gets a number here.
  publish:
    name: Publish the report
    needs: bench
    if: ${{ needs.bench.result == 'success' && github.ref == 'refs/heads/main' && inputs.job == 'Default' && fromJSON(inputs.runs) >= 3 }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-report.yml
    with:
      artifact: bench-report
      directory: bench
