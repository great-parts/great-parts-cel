# Build and tests on GitHub: JIT on Linux and macOS, Native AOT on linux-x64, browser-wasm under Node.js, all for net10.0 and net11.0, the documentation checks (examples,
# error codes page, links) on Linux, the quick start of the README on the package of the commit, plus the Signed-off-by check.
# The cells run the same commands as the container checks of eng/ (docs/design/eng-test.md), without containers: the runners have no
# SDK 11, so actions/setup-dotnet installs the SDK of global.json and the SDK 10.0.x whose runtime the net10.0 tests need.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # JIT cells. Restore is locked in every cell: Directory.Build.props sets RestoreLockedMode when GITHUB_ACTIONS is true, and the
  # explicit restore step names it. The cel-spec runner and the regression corpus are tests of tests/Great.Parts.Cel.Conformance, so
  # they run in every cell; with -showLiveOutput the summary line of each suite is in the log of the cell.
  jit:
    name: JIT ${{ matrix.os }} ${{ matrix.tfm }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        tfm: [net10.0, net11.0]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ratchet reads the history down to the merge base with main.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Restore (locked)
        run: dotnet restore Great.Parts.Cel.slnx --locked-mode

      - name: Build
        run: dotnet build Great.Parts.Cel.slnx -c Release --no-restore

      - name: Tests (JIT)
        env:
          TARGET: ${{ matrix.tfm }}
        run: |
          set -u
          status=0
          for project in tests/*/*.csproj; do
            directory=$(dirname "$project")
            name=$(basename "$project" .csproj)
            # A project without a test framework is a library (Generator.Samples): there is nothing to run.
            grep -q 'xunit\.v3' "$project" || { echo "== $name is not a test project"; continue; }
            # A project of one target (Generator.Tests, net10.0) runs in the cells of that target only.
            [ -f "$directory/bin/Release/$TARGET/$name.dll" ] || { echo "== $name has no $TARGET"; continue; }
            echo "== $name $TARGET"
            dotnet "$directory/bin/Release/$TARGET/$name.dll" -noColor -showLiveOutput \
              -result-xml "artifacts/test-results/jit/$name/$TARGET/report.xml" || status=1
          done
          exit $status

      # The tests of eng/ need Linux (StepsTests starts sh) and run once, in the cell JIT Linux net11.0, with the repository checks.
      - name: Tests of eng/ (JIT)
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.tfm == 'net11.0' }}
        run: >
          dotnet eng/tests/bin/Release/net10.0/Great.Parts.Cel.Eng.Tests.dll -noColor
          -result-xml artifacts/test-results/jit/Great.Parts.Cel.Eng.Tests/net10.0/report.xml

      # The ratchet compares with the local main. A push to main has it; a pull request starts from a detached merge commit.
      - name: Local main for the ratchet
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.tfm == 'net11.0' }}
        run: git rev-parse --verify --quiet refs/heads/main > /dev/null || git branch main origin/main

      # Suppressions, duplicates, the ratchet, the content of the packages and the traces of the plans in the texts.
      - name: Repository checks
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.tfm == 'net11.0' }}
        run: dotnet run --project eng/checks -c Release --no-build -- suppressions duplicates ratchet packages traces --no-build

  # Native AOT cells, linux-x64. A cell builds the solution, runs the two published test projects under JIT for its target (the
  # reference of the test count), publishes them as eng/test does, runs the executables and compares the tests of both runs
  # (ENG810, ENG811). A publish with a trimming or AOT warning fails, so 0 IL2xxx and IL3xxx is part of the cell. The cel-spec runner
  # and the regression corpus are in tests/Great.Parts.Cel.Conformance, one of the published projects.
  aot:
    name: AOT linux-x64 ${{ matrix.tfm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tfm: [net10.0, net11.0]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Restore (locked)
        run: dotnet restore Great.Parts.Cel.slnx --locked-mode

      - name: Build
        run: dotnet build Great.Parts.Cel.slnx -c Release --no-restore

      - name: Tests (JIT, published projects)
        env:
          TARGET: ${{ matrix.tfm }}
        run: |
          set -u
          status=0
          for project in $(grep -l '<PublishAot>true</PublishAot>' tests/*/*.csproj); do
            directory=$(dirname "$project")
            name=$(basename "$project" .csproj)
            echo "== $name $TARGET"
            dotnet "$directory/bin/Release/$TARGET/$name.dll" -noColor -showLiveOutput \
              -result-xml "artifacts/test-results/jit/$name/$TARGET/report.xml" || status=1
          done
          exit $status

      - name: Publish, run and compare the test count (Native AOT)
        env:
          TARGET: ${{ matrix.tfm }}
        run: |
          set -u
          status=0
          for project in $(grep -l '<PublishAot>true</PublishAot>' tests/*/*.csproj); do
            directory=$(dirname "$project")
            name=$(basename "$project" .csproj)
            published="artifacts/aot/$name/$TARGET"
            echo "== publish $name $TARGET"
            dotnet publish "$directory" -f "$TARGET" -r linux-x64 -c Release --no-restore \
              -p:InvariantGlobalization=true -p:BuildProjectReferences=false -o "$published/" || { status=1; continue; }
            echo "== run $name $TARGET"
            "$published/$name" -noColor -showLiveOutput \
              -result-xml "artifacts/test-results/aot/$name/$TARGET/report.xml" || status=1
            echo "== test-count $name $TARGET"
            dotnet run --project eng/checks -c Release --no-build -- test-count \
              --jit "artifacts/test-results/jit/$name/$TARGET/report.xml" \
              --aot "artifacts/test-results/aot/$name/$TARGET/report.xml" \
              --where "linux-x64, $TARGET" || status=1
          done
          exit $status

  # browser-wasm cells (docs/design/conformance.md, "browser-wasm"), both targets. The cel-spec runner
  # tests/Great.Parts.Cel.Conformance.Wasm is published as a console application of the runtime for WebAssembly in the default mode (the
  # interpreter of the runtime, IL trimming, no AOT compilation to WebAssembly) with the data of the suite embedded, and runs under Node.js
  # in a container; its exit code is the result, and the summary line and the skipped cases are in the log. The runner is built with
  # the invariant time zone mode of the runtime (the option System.TimeZoneInfo.Invariant, which a target of the project writes into
  # runtimeconfig.json after the SDK's own item with the value false), and it also checks that CelTimeZoneDatabase.FromSystem() then finds no zone (TimeZoneNotFound, never another zone).
  # The test application tests/Great.Parts.Cel.Wasm.App, a Blazor WebAssembly application that takes the assemblies of both packages as
  # roots of the trimmer, is published too: a publish with a trimming warning fails (every warning is an error), and the step counts the
  # lines IL2xxx and IL3xxx of the log (.github/scripts/il-gate.mjs), so 0 of them is part of the cell; a control example with one
  # intentional warning shows that this gate turns red. The projects are not in the solution: a build of the solution on a runner that
  # does not run this job downloads no runtime pack for WebAssembly. The SDK needs no workload: the default mode needs no wasm-tools.
  wasm:
    name: browser-wasm ${{ matrix.tfm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tfm: [net10.0, net11.0]
    env:
      # The tag and the digest change together; Node.js runs the application in the container, as the test cells run on the host.
      NODE_IMAGE: node:24.21.0-trixie-slim@sha256:173f125896c3b47ddf056734c7ea789d04595a6a08769a8f78e0df642781fb66
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Restore (locked)
        run: |
          dotnet restore tests/Great.Parts.Cel.Conformance.Wasm --locked-mode
          dotnet restore tests/Great.Parts.Cel.Wasm.App --locked-mode

      - name: Publish the runner (default mode)
        env:
          TARGET: ${{ matrix.tfm }}
        run: dotnet publish tests/Great.Parts.Cel.Conformance.Wasm -f "$TARGET" -c Release --no-restore -o "artifacts/wasm/runner/$TARGET"

      # The script that starts the runtime under Node.js is next to the published files, so the container mounts one directory.
      - name: cel-spec under Node.js (container)
        env:
          TARGET: ${{ matrix.tfm }}
        run: |
          set -euo pipefail
          cp tests/Great.Parts.Cel.Conformance.Wasm/main.mjs "artifacts/wasm/runner/$TARGET/main.mjs"
          docker run --rm --volume "$PWD/artifacts/wasm/runner/$TARGET:/app:ro" --workdir /app "$NODE_IMAGE" node main.mjs | tee "artifacts/wasm/runner-$TARGET.log"

      - name: Publish the Blazor WebAssembly application (0 warnings IL2xxx and IL3xxx)
        env:
          TARGET: ${{ matrix.tfm }}
        run: |
          set -euo pipefail
          status=0
          dotnet publish tests/Great.Parts.Cel.Wasm.App -f "$TARGET" -c Release --no-restore -o "artifacts/wasm/app/$TARGET" 2>&1 | tee "artifacts/wasm/app-$TARGET.log" || status=1
          node .github/scripts/il-gate.mjs "artifacts/wasm/app-$TARGET.log" || status=1
          exit $status

      # The control example of the gate above: the same application with one intentional warning IL2070 (-p:IlControl=true adds
      # tests/Great.Parts.Cel.Wasm.App/IlControl/IlWarning.cs) is published, and the gate has to turn red on its log. A gate that stayed
      # green here would show nothing. The publish itself may fail on the warning; only its log is read.
      - name: Control example (the gate of 0 IL warnings goes red)
        env:
          TARGET: ${{ matrix.tfm }}
        run: |
          set -u
          log="artifacts/wasm/control-$TARGET.log"
          dotnet publish tests/Great.Parts.Cel.Wasm.App -f "$TARGET" -c Release --no-restore -p:IlControl=true -o "artifacts/wasm/control/$TARGET" > "$log" 2>&1 || true
          if node .github/scripts/il-gate.mjs "$log"; then
            echo "The control example has an IL warning, but the gate stayed green."
            exit 1
          fi
          if ! grep -q 'IL2070' "$log"; then
            echo "The gate went red, but not on the warning of the control example."
            exit 1
          fi
          echo "The gate went red on the warning of the control example, as it has to."

  # The documentation (docs/design/eng-docs.md): the steps of eng/docs, and the external links, which only this cell checks. The steps run
  # in this order and, like in eng/docs, a failed step does not hide the later ones: the examples and the error codes page need the build
  # of the library, the links of both runs need only the report of lychee. lychee is the program of the official image, as in the
  # stage docs of eng/docker/Dockerfile; the tag changes together with that one. Its exit code is not used: eng/checks links turns the
  # report into findings, 404, 410 and a domain that does not exist being errors and 429, 5xx and timeouts warnings.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      LYCHEE_IMAGE: lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Restore (locked)
        run: |
          dotnet restore eng/checks --locked-mode
          dotnet restore src/Great.Parts.Cel --locked-mode

      - name: Build eng/checks
        run: dotnet build eng/checks -c Release --no-restore

      # Both targets, with the XML documentation that the examples and the error codes page are read from.
      - name: Build the library
        run: dotnet build src/Great.Parts.Cel -c Release --no-restore

      - name: Examples
        run: dotnet run --project eng/checks -c Release --no-build -- examples

      - name: Error codes page
        run: dotnet run --project eng/checks -c Release --no-build -- error-codes --page docs/error-codes.md

      - name: Links, offline (lychee)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p artifacts/docs
          status=0
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/repo" --workdir /repo "$LYCHEE_IMAGE" \
            --offline --include-fragments --format json --output artifacts/docs/lychee.json \
            --config lychee.toml README.md docs 'src/**/*.cs' || status=$?
          echo "lychee exit code $status (not used: the report is the result)"

      - name: Links, offline (findings)
        if: ${{ !cancelled() }}
        run: dotnet run --project eng/checks -c Release --no-build -- links --report artifacts/docs/lychee.json

      # The request cache of lychee outlives the run: the key is new for every run, so the cache of the last run is saved again with
      # the answers of this one, and the restore takes the latest by the prefix.
      - name: Request cache of lychee
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-

      # Only the addresses of http and https: the files and the anchors are those of the offline run. A request that fails is
      # repeated; an answer of 429 or 5xx is not cached, so the next run asks again.
      - name: Links, external (lychee)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p artifacts/docs
          status=0
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/repo" --workdir /repo "$LYCHEE_IMAGE" \
            --scheme http --scheme https --max-retries 3 --cache --max-cache-age 1d --cache-exclude-status '429, 500..' \
            --format json --output artifacts/docs/lychee-external.json \
            --config lychee.toml README.md docs 'src/**/*.cs' || status=$?
          echo "lychee exit code $status (not used: the report is the result)"

      - name: Links, external (findings)
        if: ${{ !cancelled() }}
        run: dotnet run --project eng/checks -c Release --no-build -- links --report artifacts/docs/lychee-external.json

  # The check min-sdk (docs/design/eng-test.md, "min-sdk"): the source generator of the package loads into the compiler of the oldest
  # SDK of a user of the net10.0 package. The solution is built and packed on the host, as eng/test does before it; the sample
  # application is built by the Compose service min-sdk, which runs the compiled eng/run on the image with the SDK 10.0.100. The job
  # runs on every push and pull request: the package depends on the generator and on the library, not only on the paths of eng/.
  min-sdk:
    name: min-sdk
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Restore (locked)
        run: dotnet restore Great.Parts.Cel.slnx --locked-mode

      - name: Build
        run: dotnet build Great.Parts.Cel.slnx -c Release --no-restore

      # The same pack as the step "packages" of eng/checks: the packages of the Release build in artifacts/packages.
      - name: Pack
        run: dotnet pack Great.Parts.Cel.slnx -c Release --no-build -o artifacts/packages

      - name: min-sdk (Compose)
        run: docker compose -f eng/compose.yaml run --rm -T min-sdk

  # The quick-start check (docs/design/eng-release.md, "eng/checks quick-start"): the steps of the quick start of README.md run in a clean container
  # with the SDK 10 and no network, on the package built from this commit, and take no more than 300 seconds. The package has the version
  # 1.0.0, a version with no suffix, so that "dotnet add package Great.Parts.Cel" without a version takes it. The image is the tag of the
  # stage sdk-min of the container file, as in the job build of release.yml (QUICK_START_IMAGE); the two change together. The job runs on
  # every push and pull request: the steps depend on the library and its generator, not only on the paths of eng/ and README.md.
  quick-start:
    name: Quick start
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      QUICK_START_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0.100@sha256:c7445f141c04f1a6b454181bd098dcfa606c61ba0bd213d0a702489e5bd4cd71
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Restore (locked)
        run: |
          dotnet restore eng/checks --locked-mode
          dotnet restore src/Great.Parts.Cel --locked-mode

      - name: Build eng/checks
        run: dotnet build eng/checks -c Release --no-restore

      - name: Pack the library
        run: dotnet pack src/Great.Parts.Cel -c Release --no-restore -p:Version=1.0.0 -o artifacts/quick-start/packages

      - name: Quick start (eng/checks quick-start)
        run: dotnet run --project eng/checks -c Release --no-build -- quick-start --packages artifacts/quick-start/packages --image "$QUICK_START_IMAGE"

  # Signed-off-by of every commit that reaches main (push: before..after, merges and bots included) and of every commit of a pull
  # request except those of Dependabot. A new branch or the first push has before = 0000..., then all commits of after are checked.
  signoff:
    name: Signed-off-by
    if: ${{ github.event_name == 'push' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The range needs the commits of both ends.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Check Signed-off-by
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PULL_BASE: ${{ github.event.pull_request.base.sha }}
          PULL_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "$EVENT" = "pull_request" ]; then
            range="$PULL_BASE..$PULL_HEAD"
          elif [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_AFTER"
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          echo "range: $range"
          dotnet run --project eng/checks -c Release -- signoff "$range"
