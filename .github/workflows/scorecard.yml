# OpenSSF Scorecard (https://github.com/ossf/scorecard-action): the score of the hygiene of the repository, published for the badge,
# and the findings as SARIF in code scanning. It runs on every push to main, once a week and by hand. Nothing blocks on it: it is an
# observation, and the score has no threshold. The job follows the rules of the action for publishing the result: no environment
# variables or defaults at the workflow or the job, the standard runner, and only the steps of the actions that the service allows.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    # 03:31 UTC on Mondays.
    - cron: "31 3 * * 1"
  workflow_dispatch:

# Read only for the workflow; the job below takes what the action needs.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # The SARIF file goes to code scanning.
      security-events: write
      # The token that proves the origin of the result to the Scorecard service when it is published.
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
