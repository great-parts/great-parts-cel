# The differential run against cel-go (docs/design/eng-difftest.md, "Nightly run"): every night with a budget of 20 minutes, and by hand
# with the budget of the long run before a release, 2 hours or more. It runs the command of the container check, eng/difftest, through
# eng/compose.yaml: the oracle is cel-go in the golang image of the service oracle, so the workflow has no Go setup.
# The log of this workflow is public: the run has --numbers-only, so no output names a case, and the step summary holds the journal
# line alone: the seed, the commit, the version of the oracle, the counts and the numbers of the cases of new signatures. The one
# exception is an oracle that ends on a case: the message of exit code 2 then has the expression and its lines, and the log of the
# oracle container follows it, because without them no cause can be found.
name: difftest-nightly

on:
  schedule:
    # 01:17 UTC every night.
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "Time of the run: a whole number and s, m or h. The long run before a release is 2h or more."
        type: string
        default: 2h
      seed:
        description: "Seed of the run, a whole number. Without it: the date in UTC as yyyyMMdd."
        type: string
        required: false
      findings:
        description: "Print the text of the new signatures and the findings in the log, which is public: for the analysis of a run with new signatures, with the seed and the budget of that run."
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time: a manual long run does not overlap the nightly one.
concurrency:
  group: difftest-nightly
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  difftest:
    name: Differential run
    # Only the main branch: a manual run from another branch is skipped.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      # eng/run reads git: the commit of the journal line and the state of the tree, so the history and the branch main are there.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Differential run (eng/difftest)
        env:
          # The nightly run has no inputs: its budget is the 20 minutes of the night. The values reach the script only through the
          # environment, never through the text of the script.
          BUDGET: ${{ inputs.budget || '20m' }}
          SEED: ${{ inputs.seed }}
          FINDINGS: ${{ inputs.findings }}
        run: |
          set -u
          if ! [[ "$BUDGET" =~ ^[0-9]+[smh]$ ]]; then
            echo "The budget is a whole number and s, m or h."
            exit 2
          fi
          arguments=(--numbers-only --budget "$BUDGET")
          if [ -n "$SEED" ]; then
            if ! [[ "$SEED" =~ ^[0-9]+$ ]]; then
              echo "The seed is a whole number."
              exit 2
            fi
            arguments+=(--seed "$SEED")
          fi
          if [ "$FINDINGS" = "true" ]; then
            arguments+=(--findings)
          fi

          output="$RUNNER_TEMP/difftest.txt"
          status=0
          docker compose -f eng/compose.yaml run --rm -T difftest "${arguments[@]}" > "$output" || status=$?
          cat "$output"

          # A run that could not be made, such as an oracle that ended on a case: the state and the log of the oracle container. The
          # message of eng/difftest above names the case in progress, its expression and bindings, and the lines the oracle wrote;
          # this log is what the container has of it, the lines of the oracle and the exit code of the launcher.
          if [ "$status" -ge 2 ]; then
            echo "--- the oracle container (docker compose ps -a oracle) ---"
            docker compose -f eng/compose.yaml ps -a oracle || true
            echo "--- the log of the oracle container (docker compose logs oracle) ---"
            docker compose -f eng/compose.yaml logs --no-color --tail 400 oracle || true
            echo "--- end of the log of the oracle container ---"
          fi

          # The journal line is the whole result: no other line goes to the summary.
          journal=$(grep -oE 'difftest seed=[0-9]+ commit=.*' "$output" | tail -n 1 || true)
          {
            echo "### difftest, budget $BUDGET"
            echo
            if [ -n "$journal" ]; then
              echo '```text'
              echo "$journal"
              echo '```'
            else
              echo "No journal line: the run ended without one (exit code $status)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # 0: no new signature; 1: a finding or a failed step (a new signature is the finding of the run); 2: the run could not
          # be made. Every other code is a failure too, and so is a run that ended with 0 and no journal line.
          if [ "$status" -eq 0 ] && [ -z "$journal" ]; then
            exit 1
          fi
          exit "$status"
